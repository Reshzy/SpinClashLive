[project]
name = "color-rush-live"
version = "0.1.0"
description = "Color Rush Live — YouTube livestream color prediction game backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "protobuf>=5.29.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
]
desktop = [
    "PySide6>=6.8.0",
    "keyring>=25.5.0",
    "pyinstaller>=6.11.0",
]

[project.scripts]
color-rush-demo = "color_rush.demo:main"
color-rush-worker = "color_rush.workers.__main__:main"
color-rush-api = "color_rush.api.app:run"
color-rush-bootstrap = "color_rush.bootstrap:main"
color-rush-desktop = "color_rush_desktop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/color_rush", "desktop/src/color_rush_desktop"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""
"desktop/src" = ""

[tool.uv]
package = true

[tool.hatch.build]
dev-mode-dirs = ["backend/src", "desktop/src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend/src", "backend/tests", "desktop/src", "desktop/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/*" = ["E501"]
"backend/src/color_rush/infrastructure/youtube/generated/*" = ["E", "F", "I", "UP", "B", "SIM"]
"desktop/src/color_rush_desktop/views/*" = ["E501"]
"desktop/src/color_rush_desktop/theme.py" = ["E501"]
"desktop/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src,desktop/src"
packages = ["color_rush", "color_rush_desktop"]
exclude = ["backend/migrations", "backend/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "redis",
    "redis.*",
    "jwt",
    "grpc",
    "grpc.*",
    "prometheus_client",
    "google.*",
    "keyring",
    "keyring.*",
    "color_rush.infrastructure.youtube.generated.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["color_rush.infrastructure.youtube.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["color_rush_desktop.views.*"]
disable_error_code = ["func-returns-value", "union-attr", "type-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "desktop/tests"]
pythonpath = ["backend/src", "desktop/src"]
markers = [
    "domain: pure domain tests (no database)",
    "integration: PostgreSQL integration tests",
    "redis: Redis integration tests",
    "qt: PySide6 operator console tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
