# Production-shaped example. Do not publish Postgres/Redis. Fill secrets via env file.
# From repository root:
#   docker compose -f deployment/compose.production.yaml run --rm migrate
# Not a live deployment. Do not roll this out without credentials and authorization.

name: color-rush-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: color_rush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: color_rush
    volumes:
      - color_rush_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U color_rush -d color_rush"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - color_rush_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://color_rush:${POSTGRES_PASSWORD}@postgres:5432/color_rush
      REDIS_URL: redis://redis:6379/0
      COLOR_RUSH_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://color_rush:${POSTGRES_PASSWORD}@postgres:5432/color_rush
      REDIS_URL: redis://redis:6379/0
      COLOR_RUSH_HOST: 0.0.0.0
      COLOR_RUSH_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal, edge]
    expose:
      - "8000"

  worker:
    build:
      context: ..
      dockerfile: deployment/worker.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://color_rush:${POSTGRES_PASSWORD}@postgres:5432/color_rush
      REDIS_URL: redis://redis:6379/0
      COLOR_RUSH_ENV: production
      COLOR_RUSH_WORKER_ROLE: all
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, edge]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  color_rush_pg:
  color_rush_redis:
  caddy_data:
